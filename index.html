<title>Visual Venue Map Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f2;color:#202722;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:920px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.head h1{font-size:22px;margin:0}.sub{color:#68736b;font-size:13px}
.tag{font-size:11px;background:#e2f0e6;color:#23633b;padding:6px 10px;border-radius:20px;font-weight:700}
.panel{background:white;border:1px solid #e1e5df;border-radius:14px;padding:13px;margin:12px 0}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{border:1px solid #d5ddd5;background:white;border-radius:9px;padding:9px 12px;font-size:13px;cursor:pointer;color:#243128}button.active{background:#e5f1e8;border-color:#43875a;font-weight:700}button:focus-visible{outline:3px solid #8bb99a}
.mapwrap{background:#e8e9df;border-radius:12px;overflow:hidden;position:relative;width:100%;aspect-ratio:505/770;max-height:78vh;margin:10px auto;touch-action:pan-y}
.mapinner{position:absolute;inset:0;transform-origin:center center;cursor:grab}.mapinner img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none}
.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.marker{position:absolute;transform:translate(-50%,-50%);width:43px;height:43px;border:2px solid white;border-radius:50%;background:white;box-shadow:0 2px 9px #0004;font-size:21px;display:grid;place-items:center;padding:0;z-index:2}
.marker .dot{position:absolute;right:-1px;top:-1px;width:12px;height:12px;border-radius:50%;border:1px solid white}.marker .label{position:absolute;top:43px;left:50%;transform:translateX(-50%);white-space:nowrap;background:white;color:#222;padding:2px 5px;border-radius:5px;font-size:10px;font-weight:700;box-shadow:0 1px 4px #0002}.marker.hidden-label .label{display:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{line-height:1.7}.muted{font-size:12px;color:#69756d}.detail{background:#f3f6f2;border-radius:10px;padding:12px;min-height:82px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
@media(max-width:560px){.app{padding:12px}.mapwrap{max-height:68vh}.marker{width:37px;height:37px;font-size:18px}.marker .label{top:37px}.head h1{font-size:19px}}

<script>
const $=id=>document.getElementById(id);
let places=[
{id:1,x:47,y:14,icon:'🚻',name:'トイレ',type:'toilet',crowd:'free',desc:'会場上部のトイレエリア'},
{id:2,x:51,y:65,icon:'🎪',name:'ステージ',type:'stage',crowd:'busy',desc:'中央下部のステージ広場'},
{id:3,x:51,y:37,icon:'🌿',name:'フリースペース',type:'space',crowd:'free',desc:'中央上部の休憩・自由スペース'},
{id:4,x:79,y:42,icon:'♻️',name:'回収コーナー',type:'recycle',crowd:'normal',desc:'右側のリサイクル品回収コーナー'},
{id:5,x:29,y:85,icon:'🏪',name:'マルシェ・飲食',type:'booth',crowd:'normal',desc:'下部の飲食ブース周辺'},
{id:6,x:94,y:94,icon:'🚉',name:'駅方面',type:'exit',crowd:'free',desc:'右下の大島駅方面の出口'}
];
let filter='all',labels=true,route=true,zoom=1,selected=null,addMode=false,iconOnly=false,tx=0,ty=0;
const colors={busy:'#d94747',normal:'#d99a20',free:'#269568'},crowdNames={busy:'混雑',normal:'普通',free:'空いている'};
function render(){
 $('markers').innerHTML='';
 places.filter(p=>filter==='all'||p.type===filter).forEach(p=>{
  let b=document.createElement('button');b.className='marker'+(!labels?' hidden-label':'');b.style.left=p.x+'%';b.style.top=p.y+'%';b.setAttribute('aria-label',p.name);b.title=p.name;
  b.innerHTML=p.icon+'<i class="dot" style="background:'+colors[p.crowd]+'"></i><span class="label">'+(iconOnly?'':p.name)+'</span>';
  b.onclick=e=>{e.stopPropagation();selected=p.id;showDetail(p);render()};$('markers').appendChild(b);
 });
 $('routeLine').style.display=route?'':'none';
 $('routeBtn').textContent='➜ ルート表示 '+(route?'ON':'OFF');$('routeBtn').classList.toggle('active',route);
 $('labelBtn').textContent='説明ラベル '+(labels?'ON':'OFF');$('labelBtn').classList.toggle('active',labels);
 $('iconBtn').classList.toggle('active',addMode);
 $('mapwrap').style.cursor=addMode?'crosshair':'grab';
}
function showDetail(p){
 $('detail').innerHTML='<div style="display:flex;align-items:center;gap:12px"><span style="font-size:34px">'+p.icon+'</span><div><b>'+p.name+'</b><div style="font-size:12px;color:'+colors[p.crowd]+';font-weight:700;margin-top:3px">● '+crowdNames[p.crowd]+'</div></div></div><div class="muted" style="margin-top:8px">'+p.desc+'</div>';
 $('crowdHint').textContent='選択中：'+p.name+'。上の混雑ボタンで状態を変更できます。';
}
$('filters').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$('filters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});
document.querySelectorAll('[data-crowd]').forEach(b=>b.onclick=()=>{if(!selected){$('crowdHint').textContent='先にマップ上の施設アイコンを選択してください。';return}let p=places.find(x=>x.id===selected);p.crowd=b.dataset.crowd;document.querySelectorAll('[data-crowd]').forEach(x=>x.classList.toggle('active',x===b));render();showDetail(p)});
$('routeBtn').onclick=()=>{route=!route;render()};
$('labelBtn').onclick=()=>{labels=!labels;render()};
$('languageBtn').onclick=()=>{iconOnly=!iconOnly;labels=!iconOnly;$('languageBtn').textContent=iconOnly?'🌐 説明ラベルを表示':'🌐 アイコン中心モード';render()};
$('iconBtn').onclick=()=>{addMode=!addMode;render()};
$('mapwrap').addEventListener('click',e=>{if(!addMode)return;let r=$('mapwrap').getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;let choices=[['🚻','トイレ','toilet'],['🎪','ステージ','stage'],['🌿','休憩所','space'],['🏪','ブース','booth'],['♻️','回収場所','recycle']];let c=prompt('追加する施設を選択：1 トイレ / 2 ステージ / 3 休憩所 / 4 ブース / 5 回収場所');let v=choices[Number(c)-1];if(!v)return;let p={id:Math.max(...places.map(x=>x.id))+1,x,y,icon:v[0],name:v[1],type:v[2],crowd:'normal',desc:'追加した施設'};places.push(p);selected=p.id;addMode=false;render();showDetail(p)});
function transform(){$('mapinner').style.transform=`translate(${tx}px,${ty}px) scale(${zoom})`}
$('plus').onclick=()=>{zoom=Math.min(3,zoom+.2);transform()};$('minus').onclick=()=>{zoom=Math.max(.7,zoom-.2);transform()};
$('reset').onclick=()=>{zoom=1;tx=ty=0;transform()};
$('upload').onchange=e=>{let f=e.target.files[0];if(f&&f.type.startsWith('image/')){$('mapimg').src=URL.createObjectURL(f);zoom=1;tx=ty=0;transform()}};
let drag=null;$('mapwrap').addEventListener('pointerdown',e=>{if(addMode||e.target.closest('.marker'))return;drag={x:e.clientX-tx,y:e.clientY-ty};$('mapwrap').setPointerCapture(e.pointerId)});
$('mapwrap').addEventListener('pointermove',e=>{if(!drag)return;tx=e.clientX-drag.x;ty=e.clientY-drag.y;transform()});
$('mapwrap').addEventListener('pointerup',()=>drag=null);$('mapwrap').addEventListener('pointercancel',()=>drag=null);
render();
</script></body></html>
